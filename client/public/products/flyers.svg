<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Standard flyers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101f"/><stop offset="1" stop-color="#1c1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e2f5"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f6f4ff"/><stop offset="1" stop-color="#d9d3f0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- left flyer -->
    <g transform="translate(126 172) rotate(-11)">
      <rect width="230" height="310" rx="10" fill="#cfc7ea"/>
      <rect x="-3" y="-3" width="230" height="310" rx="10" fill="url(#paper2)"/>
      <rect x="22" y="24" width="180" height="112" rx="8" fill="url(#hero)"/>
      <circle cx="150" cy="80" r="30" fill="#ffffff" opacity="0.28"/>
      <rect x="22" y="158" width="140" height="13" rx="6" fill="#2a2340"/>
      <rect x="22" y="182" width="104" height="9" rx="4" fill="#8b83ab"/>
      <rect x="22" y="204" width="180" height="8" rx="4" fill="#a49cc4"/>
      <rect x="22" y="222" width="152" height="8" rx="4" fill="#a49cc4"/>
      <rect x="22" y="252" width="96" height="28" rx="14" fill="url(#hero)"/>
    </g>

    <!-- right flyer -->
    <g transform="translate(452 168) rotate(9)">
      <rect width="230" height="310" rx="10" fill="#cfc7ea"/>
      <rect x="-3" y="-3" width="230" height="310" rx="10" fill="url(#paper2)"/>
      <rect x="22" y="24" width="180" height="112" rx="8" fill="url(#hero)" opacity="0.82"/>
      <path d="M22 108l46-38 38 30 40-40 56 44v32H22z" fill="#ffffff" opacity="0.3"/>
      <rect x="22" y="158" width="122" height="13" rx="6" fill="#2a2340"/>
      <rect x="22" y="182" width="164" height="9" rx="4" fill="#8b83ab"/>
      <rect x="22" y="204" width="180" height="8" rx="4" fill="#a49cc4"/>
      <rect x="22" y="222" width="134" height="8" rx="4" fill="#a49cc4"/>
      <rect x="22" y="252" width="96" height="28" rx="14" fill="url(#hero)"/>
    </g>

    <!-- centre flyer, on top -->
    <g transform="translate(290 128)">
      <rect x="6" y="8" width="224" height="316" rx="10" fill="#bdb4dd"/>
      <rect width="224" height="316" rx="10" fill="url(#paper)"/>
      <rect x="20" y="22" width="184" height="126" rx="8" fill="url(#hero)"/>
      <path d="M20 122l52-44 44 34 44-46 44 52v30H20z" fill="#ffffff" opacity="0.32"/>
      <circle cx="66" cy="60" r="20" fill="#ffffff" opacity="0.5"/>
      <rect x="20" y="170" width="152" height="15" rx="7" fill="#221c38"/>
      <rect x="20" y="196" width="112" height="9" rx="4" fill="#8b83ab"/>
      <rect x="20" y="220" width="184" height="8" rx="4" fill="#a49cc4"/>
      <rect x="20" y="238" width="158" height="8" rx="4" fill="#a49cc4"/>
      <rect x="20" y="268" width="104" height="30" rx="15" fill="url(#hero)"/>
    </g>
  </g>
</svg>
