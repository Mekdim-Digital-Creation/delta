<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Hardcover books">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/><stop offset="1" stop-color="#121e33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cover2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cover3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dcc4"/><stop offset="0.5" stop-color="#fdfaf2"/><stop offset="1" stop-color="#d9cbaf"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <ellipse cx="400" cy="506" rx="270" ry="26" fill="#000814" opacity="0.45"/>

  <g filter="url(#soft)">
    <!-- bottom book -->
    <g transform="translate(180 400)">
      <rect x="0" y="14" width="440" height="26" rx="6" fill="url(#page)"/>
      <rect width="440" height="20" rx="8" fill="url(#cover3)"/>
      <rect x="20" y="7" width="150" height="7" rx="3" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- middle book -->
    <g transform="translate(196 320)">
      <rect x="0" y="16" width="420" height="30" rx="6" fill="url(#page)"/>
      <rect width="420" height="22" rx="9" fill="url(#cover2)"/>
      <rect x="24" y="8" width="170" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
      <circle cx="368" cy="11" r="7" fill="#22d3ee" opacity="0.9"/>
    </g>

    <!-- top book, standing slightly proud -->
    <g transform="translate(212 210)">
      <rect x="0" y="20" width="404" height="44" rx="7" fill="url(#page)"/>
      <g stroke="#cdc0a4" stroke-width="1.5" opacity="0.7">
        <path d="M12 24v36M24 24v36M36 24v36M48 24v36M60 24v36M72 24v36M84 24v36M96 24v36M108 24v36M120 24v36M132 24v36M144 24v36M156 24v36M168 24v36M180 24v36M192 24v36M204 24v36M216 24v36M228 24v36M240 24v36M252 24v36M264 24v36M276 24v36M288 24v36M300 24v36M312 24v36M324 24v36M336 24v36M348 24v36M360 24v36M372 24v36M384 24v36"/>
      </g>
      <rect width="404" height="24" rx="10" fill="url(#cover1)"/>
      <rect x="28" y="8" width="150" height="9" rx="4" fill="#ffffff" opacity="0.6"/>
      <!-- spine -->
      <rect x="0" y="0" width="16" height="72" rx="6" fill="#0b5e73"/>
    </g>
  </g>
</svg>
