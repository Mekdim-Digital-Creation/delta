<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Premium business cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1322"/><stop offset="1" stop-color="#151d31"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7f5"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d4e8"/><stop offset="1" stop-color="#9fb0c9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- back card -->
    <g transform="translate(150 232) rotate(-9)">
      <rect x="6" y="10" width="500" height="300" rx="18" fill="url(#edge)"/>
      <rect width="500" height="300" rx="18" fill="#e8eef8"/>
    </g>
    <!-- middle card -->
    <g transform="translate(150 196) rotate(-4)">
      <rect x="6" y="10" width="500" height="300" rx="18" fill="url(#edge)"/>
      <rect width="500" height="300" rx="18" fill="#f2f6fc"/>
    </g>
    <!-- front card -->
    <g transform="translate(150 162) rotate(2)">
      <rect x="8" y="12" width="500" height="300" rx="18" fill="url(#edge)"/>
      <rect width="500" height="300" rx="18" fill="url(#face)"/>

      <rect x="46" y="52" width="86" height="86" rx="20" fill="url(#brand)"/>
      <path d="M68 95h42M78 81l16 14 16-14" stroke="#04121a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

      <rect x="46" y="172" width="188" height="17" rx="8" fill="#0f172a" opacity="0.9"/>
      <rect x="46" y="203" width="132" height="12" rx="6" fill="#64748b"/>

      <rect x="46" y="238" width="96" height="12" rx="6" fill="#94a3b8"/>
      <rect x="156" y="238" width="126" height="12" rx="6" fill="#94a3b8"/>

      <!-- spot UV accent bar -->
      <rect x="330" y="52" width="10" height="196" rx="5" fill="url(#brand)"/>
      <circle cx="424" cy="196" r="46" fill="none" stroke="url(#brand)" stroke-width="7" opacity="0.85"/>
      <path d="M400 196h48M424 172v48" stroke="#0f172a" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
</svg>
