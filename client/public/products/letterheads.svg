<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A4 letterheads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14101f"/><stop offset="1" stop-color="#1c1531"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eceff6"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- back sheet -->
    <g transform="translate(214 96) rotate(-6)">
      <rect x="8" y="10" width="372" height="470" rx="10" fill="#a9b4c6"/>
      <rect width="372" height="470" rx="10" fill="#f4f6fb"/>
    </g>

    <!-- front sheet -->
    <g transform="translate(214 108)">
      <rect x="8" y="10" width="372" height="470" rx="10" fill="#a9b4c6"/>
      <rect width="372" height="470" rx="10" fill="url(#paper)"/>

      <!-- letterhead header -->
      <rect x="34" y="34" width="304" height="4" rx="2" fill="url(#brand)"/>
      <rect x="34" y="54" width="46" height="46" rx="12" fill="url(#brand)"/>
      <path d="M48 77h18M54 69l8 8 8-8" stroke="#04121a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
      <rect x="94" y="60" width="118" height="13" rx="6" fill="#1e293b"/>
      <rect x="94" y="82" width="80" height="9" rx="4" fill="#94a3b8"/>

      <!-- contact block, right aligned -->
      <rect x="238" y="58" width="100" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="258" y="74" width="80" height="8" rx="4" fill="#dde4ee"/>
      <rect x="270" y="90" width="68" height="8" rx="4" fill="#dde4ee"/>

      <!-- body copy -->
      <rect x="34" y="140" width="180" height="12" rx="6" fill="#334155"/>
      <g fill="#c3cddb">
        <rect x="34" y="170" width="304" height="8" rx="4"/>
        <rect x="34" y="188" width="288" height="8" rx="4"/>
        <rect x="34" y="206" width="304" height="8" rx="4"/>
        <rect x="34" y="224" width="236" height="8" rx="4"/>
      </g>

      <rect x="34" y="258" width="140" height="12" rx="6" fill="#334155"/>
      <g fill="#c3cddb">
        <rect x="34" y="288" width="304" height="8" rx="4"/>
        <rect x="34" y="306" width="262" height="8" rx="4"/>
        <rect x="34" y="324" width="304" height="8" rx="4"/>
        <rect x="34" y="342" width="198" height="8" rx="4"/>
      </g>

      <!-- footer rule + sign-off -->
      <rect x="34" y="386" width="304" height="3" rx="1.5" fill="url(#brand)" opacity="0.7"/>
      <path d="M52 432c0-14 10-20 20-16 8 3 12 10 10 18" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="96" y="420" width="110" height="9" rx="4" fill="#b9c4d4"/>
      <rect x="96" y="436" width="76" height="8" rx="4" fill="#d5dde8"/>
    </g>
  </g>
</svg>
