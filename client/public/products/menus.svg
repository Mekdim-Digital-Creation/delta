<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Menu cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/><stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdfefe"/><stop offset="1" stop-color="#e4ebf4"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- back menu card -->
    <g transform="translate(200 108) rotate(-7)">
      <rect x="6" y="8" width="240" height="392" rx="20" fill="#aeb9cb"/>
      <rect width="240" height="392" rx="20" fill="#f0f4fa"/>
      <rect x="26" y="30" width="188" height="5" rx="2" fill="url(#brand)"/>
      <rect x="26" y="52" width="104" height="12" rx="6" fill="#1e293b"/>
      <g fill="#c3cddb">
        <rect x="26" y="86" width="188" height="7" rx="3"/><rect x="26" y="102" width="150" height="7" rx="3"/>
        <rect x="26" y="128" width="188" height="7" rx="3"/><rect x="26" y="144" width="164" height="7" rx="3"/>
        <rect x="26" y="170" width="188" height="7" rx="3"/><rect x="26" y="186" width="132" height="7" rx="3"/>
      </g>
    </g>

    <!-- front menu card -->
    <g transform="translate(360 118) rotate(6)">
      <rect x="8" y="10" width="252" height="404" rx="22" fill="#aeb9cb"/>
      <rect width="252" height="404" rx="22" fill="url(#card)"/>

      <rect x="28" y="32" width="46" height="46" rx="13" fill="url(#brand)"/>
      <path d="M42 55h18M47 48l9 7-9 7" stroke="#04121a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
      <rect x="88" y="42" width="120" height="13" rx="6" fill="#1e293b"/>
      <rect x="88" y="64" width="78" height="9" rx="4" fill="#94a3b8"/>
      <rect x="28" y="98" width="196" height="3" rx="1.5" fill="url(#brand)" opacity="0.65"/>

      <!-- menu rows: name ... price -->
      <g>
        <rect x="28" y="122" width="112" height="11" rx="5" fill="#334155"/>
        <rect x="188" y="122" width="36" height="11" rx="5" fill="#06b6d4"/>
        <rect x="28" y="140" width="150" height="7" rx="3" fill="#c3cddb"/>

        <rect x="28" y="172" width="96" height="11" rx="5" fill="#334155"/>
        <rect x="176" y="172" width="48" height="11" rx="5" fill="#8b5cf6"/>
        <rect x="28" y="190" width="162" height="7" rx="3" fill="#c3cddb"/>

        <rect x="28" y="222" width="128" height="11" rx="5" fill="#334155"/>
        <rect x="196" y="222" width="28" height="11" rx="5" fill="#06b6d4"/>
        <rect x="28" y="240" width="140" height="7" rx="3" fill="#c3cddb"/>

        <rect x="28" y="272" width="84" height="11" rx="5" fill="#334155"/>
        <rect x="184" y="272" width="40" height="11" rx="5" fill="#8b5cf6"/>
        <rect x="28" y="290" width="158" height="7" rx="3" fill="#c3cddb"/>
      </g>

      <rect x="28" y="322" width="196" height="3" rx="1.5" fill="#cbd5e1"/>
      <rect x="28" y="340" width="120" height="9" rx="4" fill="#aeb9cb"/>
      <rect x="28" y="358" width="150" height="9" rx="4" fill="#c3cddb"/>
    </g>
  </g>
</svg>
